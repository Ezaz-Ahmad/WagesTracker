<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No maximum-scale/user-scalable=no here — those block pinch-to-zoom,
         which low-vision users rely on. viewport-fit=cover is kept purely for
         safe-area insets on notched devices. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ec3013" />
    <!-- iOS: makes "Add to Home Screen" launch as a standalone app (no
         Safari chrome) using the icon above, instead of a generic screenshot
         thumbnail / bare page link. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Wage Tracker" />
    <title>Wage Tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
