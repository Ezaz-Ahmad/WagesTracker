name: iOS TestFlight Delivery

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: testflight-production
  cancel-in-progress: false

jobs:
  deliver-testflight:
    name: Signed TestFlight delivery
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.event.repository.fork == false
    runs-on: macos-26
    timeout-minutes: 60
    environment:
      name: testflight
    env:
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
      IOS_APP_VERSION: ${{ vars.IOS_APP_VERSION }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      IOS_PROVISIONING_PROFILE_NAME: ${{ vars.IOS_PROVISIONING_PROFILE_NAME }}

    steps:
      - name: Checkout protected main
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Verify protected-main release configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$IOS_BUNDLE_ID" == "com.ezazahmad.wagestracker" ]]
          [[ "$IOS_APP_VERSION" == "1.16.0" ]]
          [[ "$IOS_PROVISIONING_PROFILE_NAME" == "WagesTracker App Store 1.16.0" ]]
          [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]

      - name: Verify required environment secrets exist
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          missing=()
          for variable in ASC_KEY_ID ASC_ISSUER_ID ASC_API_KEY_P8_BASE64 IOS_DISTRIBUTION_P12_BASE64 IOS_DISTRIBUTION_P12_PASSWORD IOS_APP_STORE_PROFILE_BASE64; do
            [[ -n "${!variable:-}" ]] || missing+=("$variable")
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required testflight environment secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          echo "All required secret names are configured. Secret values were not printed."

      - name: Install dependencies reproducibly
        run: npm ci

      - name: Verify TestFlight workflow and release metadata
        run: npm run ios:testflight:verify -w frontend

      - name: Verify Capacitor dependency alignment
        run: npm run verify:capacitor

      - name: Run all type-checks
        run: npm run typecheck

      - name: Run all automated tests
        run: npm run test

      - name: Build normal production web application
        run: npm run build

      - name: Generate and verify branded iOS assets
        run: |
          npm run ios:assets -w frontend
          npm run ios:assets:verify -w frontend

      - name: Validate application privacy manifest
        run: plutil -lint ios/App/App/PrivacyInfo.xcprivacy

      - name: Build production iOS web assets and sync native dependencies
        run: npm run ios:sync

      - name: Verify native bundle contains one Capacitor runtime
        run: npm run verify:capacitor:bundle

      - name: Prepare unique TestFlight build number
        shell: bash
        run: |
          set -euo pipefail
          IOS_BUILD_NUMBER="${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          [[ "$IOS_BUILD_NUMBER" =~ ^[1-9][0-9]*\.[1-9][0-9]*$ ]]
          echo "IOS_BUILD_NUMBER=$IOS_BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Preparing WagesTracker $IOS_APP_VERSION build $IOS_BUILD_NUMBER."

      - name: Install temporary signing credentials
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          KEYCHAIN_PATH="$RUNNER_TEMP/wagestracker-signing.keychain-db"
          P12_PATH="$RUNNER_TEMP/wagestracker-distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/wagestracker-app-store.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/wagestracker-profile.plist"
          ASC_KEY_DIRECTORY="$HOME/.appstoreconnect/private_keys"
          ASC_KEY_PATH="$ASC_KEY_DIRECTORY/AuthKey_${ASC_KEY_ID}.p8"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"

          mkdir -p "$ASC_KEY_DIRECTORY" "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$IOS_DISTRIBUTION_P12_BASE64" | base64 -D > "$P12_PATH"
          printf '%s' "$IOS_APP_STORE_PROFILE_BASE64" | base64 -D > "$PROFILE_PATH"
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 -D > "$ASC_KEY_PATH"
          [[ -s "$P12_PATH" && -s "$PROFILE_PATH" && -s "$ASC_KEY_PATH" ]]
          grep -q -- 'BEGIN PRIVATE KEY' "$ASC_KEY_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security import "$P12_PATH" -k "$KEYCHAIN_PATH" -P "$IOS_DISTRIBUTION_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -F 'Apple Distribution:' | grep -F "($APPLE_TEAM_ID)" >/dev/null

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")"
          PROFILE_TEAM="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST")"
          PROFILE_APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")"
          PROFILE_BETA="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:beta-reports-active' "$PROFILE_PLIST")"
          [[ "$PROFILE_NAME" == "$IOS_PROVISIONING_PROFILE_NAME" ]]
          [[ "$PROFILE_TEAM" == "$APPLE_TEAM_ID" ]]
          [[ "$PROFILE_APP_ID" == "$APPLE_TEAM_ID.$IOS_BUNDLE_ID" ]]
          [[ "$PROFILE_BETA" == "true" ]]
          INSTALLED_PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          install -m 600 "$PROFILE_PATH" "$INSTALLED_PROFILE_PATH"
          printf '%s' "$INSTALLED_PROFILE_PATH" > "$RUNNER_TEMP/wagestracker-installed-profile-path"
          echo "Temporary distribution identity and App Store profile validated and installed."

      - name: Resolve native dependencies
        run: npm run ios:resolve:native

      - name: Archive signed iPhone application
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE_PATH="$RUNNER_TEMP/WagesTracker.xcarchive"
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            clean archive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" \
            MARKETING_VERSION="$IOS_APP_VERSION" \
            CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROVISIONING_PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/wagestracker-signing.keychain-db"
          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"

      - name: Export App Store Connect IPA
        shell: bash
        run: |
          set -euo pipefail
          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          EXPORT_PATH="$RUNNER_TEMP/WagesTracker-export"
          /usr/libexec/PlistBuddy -c 'Clear dict' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :method string app-store-connect' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :destination string export' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string manual' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :manageAppVersionAndBuildNumber bool false' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :stripSwiftSymbols bool true' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :uploadSymbols bool true' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$IOS_BUNDLE_ID string $IOS_PROVISIONING_PROFILE_NAME" "$EXPORT_OPTIONS"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS"
          IPA_PATH="$(find "$EXPORT_PATH" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          [[ -n "$IPA_PATH" && -s "$IPA_PATH" ]]
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Inspect exported signed application
        shell: bash
        run: |
          set -euo pipefail
          EXTRACTED_PATH="$RUNNER_TEMP/WagesTracker-ipa"
          ditto -x -k "$IPA_PATH" "$EXTRACTED_PATH"
          APP_PATH="$(find "$EXTRACTED_PATH/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          [[ -n "$APP_PATH" ]]
          plutil -lint "$APP_PATH/Info.plist" "$APP_PATH/PrivacyInfo.xcprivacy"
          node frontend/scripts/inspect-ios-artifact.mjs "$APP_PATH"
          node frontend/scripts/inspect-ios-distribution.mjs "$APP_PATH"

      - name: Validate IPA with App Store Connect
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool --validate-app --type ios --file "$IPA_PATH" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload build to TestFlight
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool --upload-app --type ios --file "$IPA_PATH" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "Upload accepted by App Store Connect. Processing and tester assignment remain in App Store Connect."

      - name: Remove temporary signing material
        if: always()
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set +e
          KEYCHAIN_PATH="$RUNNER_TEMP/wagestracker-signing.keychain-db"
          if security list-keychains -d user | grep -F "$KEYCHAIN_PATH" >/dev/null 2>&1; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
          if [[ -f "$RUNNER_TEMP/wagestracker-installed-profile-path" ]]; then
            INSTALLED_PROFILE_PATH="$(cat "$RUNNER_TEMP/wagestracker-installed-profile-path")"
            case "$INSTALLED_PROFILE_PATH" in
              "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision)
                rm -f -- "$INSTALLED_PROFILE_PATH"
                ;;
            esac
          fi
          rm -f -- \
            "$RUNNER_TEMP/wagestracker-distribution.p12" \
            "$RUNNER_TEMP/wagestracker-app-store.mobileprovision" \
            "$RUNNER_TEMP/wagestracker-profile.plist" \
            "$RUNNER_TEMP/wagestracker-installed-profile-path" \
            "$RUNNER_TEMP/ExportOptions.plist" \
            "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          rm -rf -- \
            "$RUNNER_TEMP/WagesTracker.xcarchive" \
            "$RUNNER_TEMP/WagesTracker-export" \
            "$RUNNER_TEMP/WagesTracker-ipa"
          echo "Temporary keychain, API key, provisioning profile and signed build files removed."
