name: iOS Simulator Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ios-simulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-simulator:
    name: Unsigned iOS Simulator
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        # The root optional pin keeps Lightning CSS's Darwin binary in a
        # lockfile generated on Windows; npm otherwise prunes that platform
        # record and `npm ci` cannot reproduce the macOS dependency graph.
        run: npm ci

      - name: Verify Capacitor dependency alignment
        run: npm run verify:capacitor

      - name: Generate and verify branded iOS assets
        run: |
          npm run ios:assets -w frontend
          npm run ios:assets:verify -w frontend

      - name: Validate application privacy manifest
        run: plutil -lint ios/App/App/PrivacyInfo.xcprivacy

      - name: Show native toolchain
        run: xcodebuild -version

      - name: Type-check shared frontend
        run: npm run typecheck -w frontend

      - name: Test shared frontend
        run: npm run test -w frontend

      - name: Build iOS web assets and sync native dependencies
        shell: bash
        run: |
          set -o pipefail
          npm run ios:sync 2>&1 | tee ios-sync.log

      - name: Verify native bundle contains one Capacitor runtime
        run: npm run verify:capacitor:bundle

      - name: Resolve Swift Package Manager dependencies
        run: npm run ios:resolve:native

      - name: Build unsigned iOS Simulator app
        shell: bash
        run: |
          set -o pipefail
          npm run ios:build:simulator -- ARCHS=arm64 ONLY_ACTIVE_ARCH=YES 2>&1 | tee ios-build.log

      - name: Inspect unsigned native artifact
        shell: bash
        run: |
          set -o pipefail
          plutil -lint ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app/PrivacyInfo.xcprivacy
          node frontend/scripts/inspect-ios-artifact.mjs ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app | tee ios-artifact-inspection.json

      - name: Upload iOS build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ios-simulator-build-log
          path: |
            ios-sync.log
            ios-build.log
            ios-artifact-inspection.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload unsigned Simulator app
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: WagesTracker-unsigned-simulator
          path: ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
          retention-days: 7
