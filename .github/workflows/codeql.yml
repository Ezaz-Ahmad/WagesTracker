name: CodeQL Advanced

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-shared-code:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - javascript-typescript

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze source
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  analyze-swift:
    name: Analyze (swift)
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify Capacitor dependency alignment
        run: npm run verify:capacitor

      - name: Generate and verify branded iOS assets
        run: |
          npm run ios:assets -w frontend
          npm run ios:assets:verify -w frontend

      - name: Validate application privacy manifest
        run: plutil -lint ios/App/App/PrivacyInfo.xcprivacy

      - name: Initialize Swift CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual

      - name: Build iOS web assets and sync native dependencies
        run: npm run ios:sync

      - name: Verify native bundle contains one Capacitor runtime
        run: npm run verify:capacitor:bundle

      - name: Resolve Swift Package Manager dependencies
        run: npm run ios:resolve:native

      - name: Build unsigned arm64 iOS Simulator app
        run: >-
          npm run ios:build:simulator --
          ARCHS=arm64
          ONLY_ACTIVE_ARCH=YES
          COMPILATION_CACHE_ENABLE_CACHING=NO
          SWIFT_ENABLE_COMPILE_CACHE=NO

      - name: Inspect unsigned native artifact
        run: |
          plutil -lint ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app/PrivacyInfo.xcprivacy
          node frontend/scripts/inspect-ios-artifact.mjs ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app

      - name: Analyze Swift
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:swift
