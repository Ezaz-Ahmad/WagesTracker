name: iOS TestFlight Availability Check

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Existing uploaded TestFlight build number (never uploads a binary)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: testflight-production
  cancel-in-progress: false

jobs:
  check-testflight:
    name: Check existing internal TestFlight build
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: testflight
    env:
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
      IOS_APP_VERSION: ${{ vars.IOS_APP_VERSION }}
      IOS_BUILD_NUMBER: ${{ inputs.build_number }}

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install temporary Apple API credential
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" && "$GITHUB_RUN_ATTEMPT" == "1" ]]
          [[ "$IOS_BUNDLE_ID" == "com.ezazahmad.wagestracker" ]]
          [[ "$IOS_BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$ASC_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]
          [[ "$IOS_APP_VERSION" == "$(node -p "require('./frontend/package.json').version")" ]]
          umask 077
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Confirm existing build without uploading or changing groups
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: node frontend/scripts/confirm-testflight-build.mjs --check-only

      - name: Remove temporary Apple API credential
        if: always()
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          if [[ "$ASC_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            rm -f -- "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          fi
