services:
  - type: web
    name: wage-tracker-api
    runtime: node
    plan: free
    rootDir: .
    # --include=dev is required even though NODE_ENV=production is set below: npm treats that env var
    # as an implicit "skip devDependencies" flag, but typescript and the @types/* packages needed to
    # compile the backend live in devDependencies. This forces them in for the build step; the compiled
    # output in dist/ is plain JS, so it doesn't matter that devDependencies are present at runtime.
    buildCommand: npm install --include=dev && npm run build -w backend
    startCommand: npm run start -w backend
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        generateValue: true
      - key: TURSO_DATABASE_URL
        sync: false # your hosted libSQL/Turso database URL, e.g. libsql://your-db-your-org.turso.io — see README
      - key: TURSO_AUTH_TOKEN
        sync: false # token for the database above, from `turso db tokens create <db-name>`
      - key: ALLOWED_ORIGINS
        sync: false # set to your deployed frontend URL(s), comma-separated, after the frontend is deployed
      - key: ADMIN_PASSWORD
        sync: false # a strong password of your choosing — gates the admin panel at <frontend-url>/admin
    # No `disk:` block needed: the database lives on Turso (see TURSO_DATABASE_URL above), not on this
    # service's local filesystem, so the free plan's lack of persistent disk no longer matters — data
    # survives restarts and redeploys either way.
