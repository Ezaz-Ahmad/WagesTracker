services:
  - type: web
    name: wage-tracker-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build -w backend
    startCommand: npm run start -w backend
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: ./data/wage-tracker.sqlite # NOTE: ephemeral on the free plan (no disk) — wiped on every restart/redeploy. See README.
      - key: ALLOWED_ORIGINS
        sync: false # set to your deployed frontend URL(s), comma-separated, after the frontend is deployed
    # Free plan doesn't support persistent disks, so there's no `disk:` block here — the SQLite file
    # lives on the service's local (ephemeral) filesystem. To keep data across restarts/redeploys,
    # upgrade this service to at least the Starter plan and add:
    #   disk:
    #     name: wage-tracker-data
    #     mountPath: /var/data
    #     sizeGB: 1
    # ...and point DB_PATH at /var/data/wage-tracker.sqlite instead.
